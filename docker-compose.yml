services:
  smartboot-discordbot:
    build: .
    container_name: smartboot-discordbot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - asterisk
    ports:
      - "2668:3000"
    volumes:
      - smartboot-data:/app/data
      - ./secrets:/run/secrets:ro
    init: true

  asterisk:
    build: ./asterisk
    container_name: smartboot-asterisk
    restart: unless-stopped
    env_file: .env
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - smartboot-data:/var/lib/asterisk/sounds/custom

volumes:
  smartboot-data:
