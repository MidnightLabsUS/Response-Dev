<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SmartBoot Response · Asterisk</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font:14px system-ui,sans-serif}nav{width:220px;position:fixed;inset:0 auto 0 0;background:#0f0f0f;border-right:1px solid #222;padding:24px}nav h1{font-size:16px;margin:0 0 28px}nav a{display:block;color:#888;text-decoration:none;padding:10px 8px;border-radius:6px}nav a:hover{background:#181818;color:#fff}main{margin-left:220px;padding:32px;max-width:1200px}h2{margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#111;border:1px solid #222;border-radius:9px;padding:18px}.label{color:#777;font-size:12px}.value{font-size:24px;margin-top:8px}.ok{color:#79d279}.bad{color:#e66}.panel{margin-top:18px;background:#111;border:1px solid #222;border-radius:9px;padding:18px}pre{white-space:pre-wrap;color:#aaa;max-height:400px;overflow:auto}@media(max-width:800px){nav{position:static;width:auto}main{margin:0}.grid{grid-template-columns:1fr 1fr}}</style></head><body><nav><h1>SmartBoot Response</h1><a href=#>Dashboard</a><a href=/asterisk/extensions>Extensions</a><a href=/asterisk/calls>Calls</a><a href=/asterisk/logs>Logs</a><a href=/asterisk/settings>Settings</a></nav><main><h2>Asterisk</h2><div class=grid><div class=card><div class=label>Asterisk</div><div id=s class=value>Checking...</div></div><div class=card><div class=label>Active Channels</div><div id=c class=value>—</div></div><div class=card><div class=label>AMI</div><div id=a class=value>—</div></div><div class=card><div class=label>System</div><div id=i class=value>Online</div></div></div><div class=panel><div class=label>Recent Asterisk Log</div><pre id=l>Loading...</pre></div></main><script>async function j(u){return fetch(u).then(r=>r.json())}async function load(){let s=await j("/api/asterisk/status");document.querySelector("#s").textContent=s.online?"Online":"Offline";document.querySelector("#s").className="value "+(s.online?"ok":"bad");document.querySelector("#a").textContent=s.online?"Connected":"Unavailable";let c=await j("/api/asterisk/channels");document.querySelector("#c").textContent=c.channels?.length||0;let l=await fetch("/api/asterisk/logs");document.querySelector("#l").textContent=await l.text()}load();setInterval(load,5000)</script></body></html>
